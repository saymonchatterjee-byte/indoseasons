<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Operations Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="sidebar-backdrop" id="backdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon" style="height:2rem;width:2rem;font-size:0.8rem;">IS</div>
        <span class="brand-name" style="font-size:0.9rem;">Operations Portal</span>
        <button class="sidebar-close" id="sidebar-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="nav-list">
        <!-- nav items injected by JS so admin-only items can be hidden -->
      </nav>

      <div class="sidebar-footer">
        <div class="profile-row">
          <div class="avatar" id="avatar-initial">?</div>
          <div class="profile-meta">
            <p class="profile-name" id="profile-name">Loading…</p>
            <span class="role-badge" id="role-badge"></span>
          </div>
        </div>
        <button class="btn-logout" onclick="logout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <span class="breadcrumb">/dashboard.html</span>
      </header>

      <main class="page-content">
        <h1>Dashboard</h1>
        <p>Module 2 (Customer records) and Module 3 (Inventory) will render here.</p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    const NAV_ITEMS = [
      { label: 'Dashboard',  href: 'dashboard.html',  icon: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>' },
      { label: 'Customers',  href: 'customers.html',  icon: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>' },
      { label: 'Inventory',  href: 'inventory.html',  icon: '<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>' },
      { label: 'Import',     href: 'import.html',     icon: '<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', adminOnly: true },
      { label: 'Settings',   href: 'settings.html',   icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>', adminOnly: true },
    ];

    const currentPage = window.location.pathname.split('/').pop();

    function renderNav(role) {
      const navList = document.getElementById('nav-list');
      navList.innerHTML = NAV_ITEMS
        .filter((item) => !item.adminOnly || role === 'admin')
        .map((item) => `
          <a class="nav-item ${item.href === currentPage ? 'active' : ''}" href="${item.href}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${item.icon}</svg>
            ${item.label}
          </a>
        `)
        .join('');
    }

    // Mobile drawer toggling
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    document.getElementById('menu-toggle').addEventListener('click', () => {
      sidebar.classList.add('open');
      backdrop.classList.add('visible');
    });
    document.getElementById('sidebar-close').addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);
    function closeDrawer() {
      sidebar.classList.remove('open');
      backdrop.classList.remove('visible');
    }

    // Auth check + profile summary
    requireAuth().then(({ session, profile }) => {
      const name = (profile && profile.full_name) || session.user.email;
      document.getElementById('profile-name').textContent = name;
      document.getElementById('avatar-initial').textContent = name.charAt(0).toUpperCase();

      const role = profile ? profile.role : 'worker';
      const badge = document.getElementById('role-badge');
      badge.classList.add(role);
      badge.innerHTML = role === 'admin'
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Admin'
        : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="4" r="2"/><path d="M12 6v2"/></svg> Worker';

      renderNav(role);
    });
  </script>
</body>
</html>
